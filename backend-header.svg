<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Ibrahim Mahmoud - Backend Developer</title>
  <desc id="d">Animated dark terminal-style header with neon green accents.</desc>
  <style>
    .mono { font-family: 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace; }
    .name { font-family: 'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-weight: 700; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#12161b"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#39d353" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39d353"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2933" stroke-width="1" opacity="0.5"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <!-- flowing lines -->
    <path d="M0 246H1000" stroke="url(#flow)" stroke-width="2" stroke-dasharray="260 740" fill="none">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0 14H1000" stroke="url(#flow)" stroke-width="1" stroke-dasharray="160 840" fill="none" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="1000" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- particles -->
    <g fill="#39d353">
      <circle cx="120" cy="230" r="2"><animate attributeName="cy" values="230;20" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="240" r="1.5"><animate attributeName="cy" values="240;30" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="235" r="2"><animate attributeName="cy" values="235;25" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="245" r="1.5" fill="#22d3ee"><animate attributeName="cy" values="245;40" dur="6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="240" r="2" fill="#22d3ee"><animate attributeName="cy" values="240;20" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="230" r="1.5"><animate attributeName="cy" values="230;30" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- terminal prompt -->
    <text class="mono" x="60" y="64" font-size="16" fill="#22d3ee">~/backend $ <tspan fill="#8b949e">node server.js</tspan><tspan class="cursor" fill="#39d353"> _</tspan></text>

    <!-- name + title -->
    <text class="name" x="60" y="135" font-size="56" fill="#e6edf3" filter="url(#glow)">Ibrahim Mahmoud</text>
    <text class="mono" x="62" y="178" font-size="22" font-weight="600" letter-spacing="6" fill="#39d353">BACKEND DEVELOPER</text>
    <text class="mono" x="62" y="212" font-size="14" fill="#8b949e">Node.js · NestJS · PostgreSQL · REST APIs</text>

    <!-- decorative request card -->
    <g transform="translate(690,62)">
      <rect width="250" height="116" rx="10" fill="#0d1117" stroke="#30363d"/>
      <circle cx="18" cy="16" r="4" fill="#ff5f56"/>
      <circle cx="34" cy="16" r="4" fill="#ffbd2e"/>
      <circle cx="50" cy="16" r="4" fill="#27c93f"/>
      <text class="mono" x="16" y="48" font-size="12" fill="#22d3ee">GET /api/developer</text>
      <text class="mono" x="16" y="70" font-size="12" fill="#39d353">200 OK</text>
      <text class="mono" x="16" y="92" font-size="12" fill="#8b949e">{ "role": "backend" }</text>
      <rect x="0" y="0" width="250" height="2" fill="#39d353" opacity="0.5">
        <animate attributeName="y" values="0;114;0" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
