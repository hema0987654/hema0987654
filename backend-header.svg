<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ibrahim Mahmoud — Backend Developer</title>
  <desc id="desc">A dark terminal-inspired banner with neon green and cyan lines, subtle animated dots, and a backend developer identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B0A"/>
      <stop offset="55%" stop-color="#0D1513"/>
      <stop offset="100%" stop-color="#081016"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39FF88" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#55DDE0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#39FF88" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#39FF88" stroke-opacity=".32"/>
  <g opacity=".85">
    <path d="M0 228H1200" stroke="url(#line)" stroke-width="1.5"/>
    <path d="M0 238H430L470 198H740L780 238H1200" fill="none" stroke="#55DDE0" stroke-opacity=".16"/>
    <path d="M0 68H270L300 98H490" fill="none" stroke="#39FF88" stroke-opacity=".22"/>
    <path d="M860 40H1000L1030 70H1200" fill="none" stroke="#55DDE0" stroke-opacity=".25"/>
  </g>
  <g fill="#39FF88" filter="url(#glow)">
    <circle cx="90" cy="68" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="212" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="95" r="1.8"><animate attributeName="cy" values="95;105;95" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="250" r="1.5"><animate attributeName="cx" values="200;250;200" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
    <text x="68" y="66" font-size="13" fill="#55DDE0" letter-spacing="3">BACKEND / ENGINEERING</text>
    <text x="64" y="137" font-size="48" font-weight="700" fill="#E8FFF0">Ibrahim Mahmoud</text>
    <rect x="68" y="158" width="7" height="30" rx="2" fill="#39FF88"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
    <text x="91" y="180" font-size="20" font-weight="600" fill="#39FF88" letter-spacing="4">BACKEND DEVELOPER</text>
    <text x="68" y="265" font-size="13" fill="#8BA69A">Node.js  /  NestJS  /  REST APIs  /  PostgreSQL</text>
    <text x="1130" y="265" font-size="12" fill="#55DDE0" text-anchor="end">$ build --clean</text>
  </g>
</svg>
