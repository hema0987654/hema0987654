<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 44" width="880" height="44" role="img" aria-label="Status: building REST APIs with NestJS, learning system design and testing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .rp{transform-box:fill-box;transform-origin:center;animation:rp 2.6s ease-out infinite}
